<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeDash PIN</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    form { display: grid; gap: 14px; width: min(320px, 90vw); }
    input, button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    button { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 800; cursor: pointer; }
    .error { color: var(--danger); margin: 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h2>HomeDash</h2>
    <p class="error" id="error" hidden>Wrong PIN.</p>
    <input type="password" name="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" autofocus required>
    <input type="hidden" name="next" id="next">
    <button type="submit">Sign in</button>
  </form>
  <script>
    var params = new URLSearchParams(location.search);
    document.getElementById('next').value = params.get('next') || '/home';
    if (params.get('error')) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
