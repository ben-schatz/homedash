<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Kiddo Board</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/kid/kid.css">
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="title">TODAY</p>
        <p id="clock" class="clock">--:--</p>
      </div>
      <p id="today-date" class="date-label"></p>
    </header>
    <section class="countdown-grid" id="countdowns"></section>
    <section class="routine-grid" id="routines"></section>
    <footer class="footer-hint">Tap a box when you finish</footer>
  </main>
  <script src="/kid/kid.js"></script>
</body>
</html>
